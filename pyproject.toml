[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "1.0.0"
description = "A voice personal assistant powered by OpenVINO Whisper Base INT8, LM Studio LLM, and Qwen TTS"
authors = [
    { name = "Personal Assistant Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "openvino>=2024.0.0",
    "optimum[openvino]>=1.17.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "kokoro>=0.9.4",
    "kokoro-onnx>=0.6.1",
    "qwen-tts>=0.1.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "av>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

